<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="https://fxzlolserverdatalog.ct.ws/images/a1365559957_10.jpg">
    <title>✂️ Cut-A-Rote</title>
    <!-- Google Fonts & Font Awesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 20% 30%, #1a1a2e, #16213e, #0f0f1f);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #e0e0e0;
        }

        /* Гласс-контейнер */
        .container {
            max-width: 850px;
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 28px 30px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-weight: 700;
            font-size: 2.2rem;
            background: linear-gradient(135deg, #f0a6ff, #6dd5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        h1 i {
            font-size: 2rem;
            -webkit-text-fill-color: initial;
            color: #f0a6ff;
        }

        .hidden {
            display: none !important;
        }

        /* ----- АВТОРИЗАЦИЯ ----- */
        #auth {
            max-width: 400px;
            margin: 20px auto;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 28px;
            padding: 30px 28px;
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 0.6s ease-out;
        }

        .auth-card h2 {
            font-weight: 600;
            font-size: 1.6rem;
            margin-bottom: 20px;
            color: #fff;
            text-align: center;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: #b0b0c8;
            margin-bottom: 5px;
            letter-spacing: 0.3px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            color: #fff;
            font-size: 0.95rem;
            transition: all 0.25s ease;
            outline: none;
            font-family: 'Inter', sans-serif;
        }

        .form-group input:focus {
            border-color: #6dd5fa;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(109, 213, 250, 0.15);
        }

        .form-group input::placeholder {
            color: #80809a;
        }

        .btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #6dd5fa, #a78bfa);
            border: none;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.95rem;
            color: #fff;
            cursor: pointer;
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(109, 213, 250, 0.25);
            font-family: 'Inter', sans-serif;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(109, 213, 250, 0.35);
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-danger {
            background: linear-gradient(135deg, #f87171, #ef4444);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.25);
        }
        .btn-danger:hover {
            box-shadow: 0 8px 20px rgba(239, 68, 68, 0.4);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: none;
        }
        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.05);
            box-shadow: none;
        }

        .error {
            color: #fca5a5;
            font-size: 0.9rem;
            margin-top: 8px;
        }
        .success {
            color: #86efac;
            font-size: 0.9rem;
            margin-top: 8px;
        }

        .auth-switch {
            text-align: center;
            margin-top: 16px;
            color: #a0a0b8;
        }
        .auth-switch a {
            color: #6dd5fa;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }
        .auth-switch a:hover {
            color: #a78bfa;
        }

        /* ----- ВКЛАДКИ ----- */
        .tab {
            display: flex;
            gap: 6px;
            margin: 24px 0 18px;
            flex-wrap: wrap;
            background: rgba(255, 255, 255, 0.04);
            padding: 6px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .tab button {
            flex: 1;
            padding: 10px 14px;
            background: transparent;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.85rem;
            color: #b0b0c8;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .tab button i {
            font-size: 1rem;
        }

        .tab button.active {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .tab button:hover:not(.active) {
            color: #d0d0e8;
            background: rgba(255, 255, 255, 0.03);
        }

        #logoutBtn {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
        }
        #logoutBtn:hover {
            background: rgba(239, 68, 68, 0.25);
        }

        /* ----- КОНТЕНТ ВКЛАДОК ----- */
        .tab-content {
            animation: fadeInUp 0.4s ease-out;
            margin-top: 8px;
        }

        .profile-info {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 24px;
            padding: 20px 24px;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .profile-info p {
            margin: 6px 0;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .profile-info strong {
            color: #b0b0c8;
            font-weight: 500;
            width: 100px;
        }

        .section-title {
            font-weight: 600;
            font-size: 1.1rem;
            margin: 22px 0 12px;
            color: #d0d0e8;
        }

        .search-result {
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .search-result:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.1);
            transform: translateX(4px);
        }

        .dialog-list {
            max-height: 300px;
            overflow-y: auto;
            margin-top: 10px;
            padding-right: 4px;
        }
        .dialog-list::-webkit-scrollbar {
            width: 4px;
        }
        .dialog-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
        }

        .dialog-item {
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            margin-bottom: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid transparent;
        }
        .dialog-item:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.06);
            transform: translateX(4px);
        }
        .dialog-item .unread-badge {
            background: #6dd5fa;
            color: #0f0f1f;
            font-weight: 700;
            border-radius: 40px;
            padding: 2px 12px;
            font-size: 0.75rem;
            box-shadow: 0 0 8px rgba(109, 213, 250, 0.4);
        }

        /* ----- ЧАТ ----- */
        #chatHeader {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }
        #chatHeader h3 {
            font-weight: 600;
            font-size: 1.2rem;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #chatHeader .actions {
            display: flex;
            gap: 8px;
        }

        #messages {
            max-height: 400px;
            overflow-y: auto;
            padding: 12px 8px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        #messages::-webkit-scrollbar {
            width: 4px;
        }
        #messages::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
        }

        .msg {
            max-width: 80%;
            padding: 10px 16px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            animation: slideIn 0.25s ease-out;
            align-self: flex-start;
            position: relative;
        }

        .msg.me {
            align-self: flex-end;
            background: linear-gradient(135deg, #6dd5fa, #a78bfa);
            border: none;
            color: #fff;
        }

        .msg .time {
            font-size: 0.65rem;
            opacity: 0.5;
            margin-top: 4px;
            text-align: right;
        }
        .msg.me .time {
            opacity: 0.7;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chat-input-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .chat-input-row input {
            flex: 1;
            padding: 12px 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 40px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
        }
        .chat-input-row input:focus {
            border-color: #6dd5fa;
            background: rgba(255, 255, 255, 0.07);
        }
        .chat-input-row input::placeholder {
            color: #80809a;
        }

        /* Контекстное меню */
        .context-menu {
            display: none;
            position: fixed;
            background: rgba(30, 30, 50, 0.95);
            backdrop-filter: blur(16px);
            border-radius: 20px;
            padding: 6px 0;
            min-width: 180px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
            z-index: 1000;
            overflow: hidden;
        }
        .context-menu .item {
            padding: 10px 20px;
            cursor: pointer;
            color: #e0e0e0;
            transition: background 0.15s;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
        }
        .context-menu .item:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        .context-menu .item.danger {
            color: #f87171;
        }
        .context-menu .item.danger:hover {
            background: rgba(239, 68, 68, 0.15);
        }

        /* Адаптив */
        @media (max-width: 600px) {
            .container { padding: 20px 16px; }
            .tab button { font-size: 0.75rem; padding: 8px 6px; }
            .tab button i { font-size: 0.9rem; }
            .msg { max-width: 90%; }
        }

        /* Спиннер загрузки */
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: #6dd5fa;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Стиль для заблокированного чата */
        .blocked-overlay {
            opacity: 0.5;
            pointer-events: none;
        }
        .blocked-badge {
            display: inline-block;
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        /* Тосты */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 30, 50, 0.9);
            backdrop-filter: blur(12px);
            padding: 12px 24px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #e0e0e0;
            font-weight: 500;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            z-index: 2000;
            animation: slideUp 0.3s ease-out;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        /* SVG иконки верификации */
        .verify-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            vertical-align: middle;
            margin-right: 4px;
        }
        .verify-icon svg {
            display: block;
            width: 18px;
            height: 18px;
        }
    </style>
</head>
<body>
<div class="container" id="app">
    <h1><i class="fas fa-cut"></i> Cut-A-Rote</h1>

    <!-- Звуки -->
    <audio id="notif-sound" preload="auto"></audio>
    <audio id="send-sound" preload="auto"></audio>

    <!-- Блок авторизации -->
    <div id="auth">
        <div id="loginForm" class="auth-card">
            <h2><i class="fas fa-sign-in-alt"></i> Вход</h2>
            <div class="form-group">
                <label><i class="fas fa-user"></i> Имя пользователя</label>
                <input type="text" id="loginUsername" placeholder="username" />
            </div>
            <div class="form-group">
                <label><i class="fas fa-lock"></i> Пароль</label>
                <input type="password" id="loginPassword" placeholder="пароль" />
            </div>
            <button class="btn" id="loginBtn"><i class="fas fa-arrow-right"></i> Войти</button>
            <div class="auth-switch">Нет аккаунта? <a href="#" id="showRegister">Зарегистрироваться</a></div>
            <div id="loginError" class="error"></div>
        </div>

        <div id="registerForm" class="auth-card hidden">
            <h2><i class="fas fa-user-plus"></i> Регистрация</h2>
            <div class="form-group">
                <label><i class="fas fa-user"></i> Username</label>
                <input type="text" id="regUsername" placeholder="уникальный логин" />
            </div>
            <div class="form-group">
                <label><i class="fas fa-id-badge"></i> Nickname</label>
                <input type="text" id="regNickname" placeholder="отображаемое имя" />
            </div>
            <div class="form-group">
                <label><i class="fas fa-lock"></i> Пароль</label>
                <input type="password" id="regPassword" placeholder="пароль" />
            </div>
            <button class="btn" id="registerBtn"><i class="fas fa-user-check"></i> Зарегистрироваться</button>
            <div class="auth-switch">Уже есть аккаунт? <a href="#" id="showLogin">Войти</a></div>
            <div id="registerError" class="error"></div>
            <div id="registerSuccess" class="success"></div>
        </div>
    </div>

    <!-- Основное приложение -->
    <div id="mainApp" class="hidden">
        <div class="tab">
            <button class="active" data-tab="profile"><i class="fas fa-user-circle"></i> Профиль</button>
            <button data-tab="search"><i class="fas fa-search"></i> Поиск</button>
            <button data-tab="chat"><i class="fas fa-comment-dots"></i> Чат</button>
            <button data-tab="dialogs"><i class="fas fa-list-ul"></i> Диалоги</button>
            <button id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Выйти</button>
        </div>

        <!-- Профиль -->
        <div id="tabProfile" class="tab-content">
            <div class="profile-info">
                <p><strong><i class="fas fa-hashtag"></i> ID:</strong> <span id="profileId"></span></p>
                <p><strong><i class="fas fa-user"></i> Username:</strong> <span id="profileUsername"></span></p>
                <p><strong><i class="fas fa-id-badge"></i> Nickname:</strong> <span id="profileNickname"></span></p>
                <p><strong><i class="fas fa-check-circle"></i> Verified:</strong> <span id="profileVerified"></span></p>
            </div>

            <div class="section-title"><i class="fas fa-key"></i> Сменить пароль</div>
            <div class="form-group">
                <label>Старый пароль</label>
                <input type="password" id="oldPassword" />
            </div>
            <div class="form-group">
                <label>Новый пароль</label>
                <input type="password" id="newPassword" />
            </div>
            <button class="btn" id="changePasswordBtn"><i class="fas fa-sync-alt"></i> Сменить пароль</button>
            <div id="passwordChangeResult"></div>

            <div class="section-title"><i class="fas fa-edit"></i> Сменить username и nickname</div>
            <div class="form-group">
                <label>Новый username</label>
                <input type="text" id="newUsername" />
            </div>
            <div class="form-group">
                <label>Новый nickname</label>
                <input type="text" id="newNickname" />
            </div>
            <button class="btn" id="updateProfileBtn"><i class="fas fa-save"></i> Обновить профиль</button>
            <div id="profileUpdateResult"></div>
        </div>

        <!-- Поиск -->
        <div id="tabSearch" class="tab-content hidden">
            <div class="form-group">
                <label><i class="fas fa-search"></i> Поиск пользователей</label>
                <input type="text" id="searchInput" placeholder="введите username или nickname" />
            </div>
            <button class="btn" id="searchBtn"><i class="fas fa-search"></i> Найти</button>
            <div id="searchResults" style="margin-top:16px;"></div>
        </div>

        <!-- Чат -->
        <div id="tabChat" class="tab-content hidden">
            <div id="chatHeader">
                <h3><i class="fas fa-comment"></i> Чат с <span id="chatPartnerName">...</span></h3>
                <div class="actions">
                    <button class="btn btn-outline" id="refreshChatBtn"><i class="fas fa-sync-alt"></i></button>
                    <button class="btn btn-danger" id="blockChatBtn"><i class="fas fa-ban"></i> Заблокировать</button>
                </div>
            </div>
            <div id="messages"></div>
            <div class="chat-input-row">
                <input type="text" id="messageInput" placeholder="Введите сообщение..." />
                <button class="btn" id="sendMessageBtn"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>

        <!-- Диалоги -->
        <div id="tabDialogs" class="tab-content hidden">
            <h3 style="font-weight:600; margin-bottom:12px;"><i class="fas fa-comments"></i> Все чаты</h3>
            <div id="dialogList" class="dialog-list"></div>
        </div>
    </div>
</div>

<!-- Контекстное меню -->
<div id="contextMenu" class="context-menu">
    <div class="item danger" data-action="delete"><i class="fas fa-trash-alt"></i> Удалить для всех</div>
</div>

<script>
    // ---- Глобальные переменные ----
    let currentUserId = null;
    let currentUsername = null;
    let currentNickname = null;
    let currentVerified = false;
    let chatPartnerId = null;
    let chatInterval = null;
    let unreadCounts = {};
    let dialogsList = [];
    let isBlocked = false;

    // ---- DOM ----
    const $ = id => document.getElementById(id);
    const loginForm = $('loginForm');
    const registerForm = $('registerForm');
    const loginBtn = $('loginBtn');
    const registerBtn = $('registerBtn');
    const showRegister = $('showRegister');
    const showLogin = $('showLogin');
    const loginError = $('loginError');
    const registerError = $('registerError');
    const registerSuccess = $('registerSuccess');

    const profileId = $('profileId');
    const profileUsername = $('profileUsername');
    const profileNickname = $('profileNickname');
    const profileVerified = $('profileVerified');
    const oldPassword = $('oldPassword');
    const newPassword = $('newPassword');
    const changePasswordBtn = $('changePasswordBtn');
    const passwordChangeResult = $('passwordChangeResult');
    const newUsername = $('newUsername');
    const newNickname = $('newNickname');
    const updateProfileBtn = $('updateProfileBtn');
    const profileUpdateResult = $('profileUpdateResult');

    const searchInput = $('searchInput');
    const searchBtn = $('searchBtn');
    const searchResults = $('searchResults');

    const chatPartnerName = $('chatPartnerName');
    const messagesDiv = $('messages');
    const messageInput = $('messageInput');
    const sendMessageBtn = $('sendMessageBtn');
    const refreshChatBtn = $('refreshChatBtn');
    const logoutBtn = $('logoutBtn');
    const blockChatBtn = $('blockChatBtn');

    const tabButtons = document.querySelectorAll('.tab button[data-tab]');
    const tabContents = {
        profile: $('tabProfile'),
        search: $('tabSearch'),
        chat: $('tabChat'),
        dialogs: $('tabDialogs')
    };
    const dialogListEl = $('dialogList');
    const contextMenu = $('contextMenu');

    // ---- ЗВУКИ (без изменений) ----
    let playSound = function(type) {
        console.warn('playSound not initialized yet');
    };

    // ---- SVG-иконка верификации ----
    function getVerifiedSVG(verified, size = 18) {
        if (verified) {
            return `<span class="verify-icon"><svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z" fill="#6dd5fa" stroke="#6dd5fa" stroke-width="2"/><path d="M7 12L10.5 15.5L17 9" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>`;
        } else {
            return `<span class="verify-icon"><svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z" fill="#555" stroke="#555" stroke-width="2"/><path d="M15 9L9 15M9 9L15 15" stroke="white" stroke-width="2.5" stroke-linecap="round"/></svg></span>`;
        }
    }

    // ---- Вспомогательные функции ----
    function showTab(tabId) {
        Object.keys(tabContents).forEach(key => {
            tabContents[key].classList.toggle('hidden', key !== tabId);
        });
        tabButtons.forEach(btn => {
            btn.classList.toggle('active', btn.dataset.tab === tabId);
        });
        if (tabId === 'chat' && chatPartnerId) loadMessages();
        if (tabId === 'dialogs') loadDialogs();
    }

    function showAuth() {
        $('auth').classList.remove('hidden');
        $('mainApp').classList.add('hidden');
        loginForm.classList.remove('hidden');
        registerForm.classList.add('hidden');
        if (chatInterval) clearInterval(chatInterval);
    }

    function showApp() {
        $('auth').classList.add('hidden');
        $('mainApp').classList.remove('hidden');
        profileId.textContent = currentUserId;
        profileUsername.textContent = currentUsername;
        profileNickname.textContent = currentNickname;
        // Обновляем статус верификации с SVG
        profileVerified.innerHTML = getVerifiedSVG(currentVerified) + (currentVerified ? ' Да' : ' Нет');
        newUsername.value = currentUsername;
        newNickname.value = currentNickname;
        showTab('profile');
        loadDialogs();
    }

    async function loadProfile() {
        try {
            const res = await fetch(`/profile/${currentUserId}`);
            if (res.ok) {
                const data = await res.json();
                currentUsername = data.username;
                currentNickname = data.nickname;
                currentVerified = data.verified || false;
                profileUsername.textContent = currentUsername;
                profileNickname.textContent = currentNickname;
                profileVerified.innerHTML = getVerifiedSVG(currentVerified) + (currentVerified ? ' Да' : ' Нет');
                newUsername.value = currentUsername;
                newNickname.value = currentNickname;
                localStorage.setItem('username', currentUsername);
                localStorage.setItem('nickname', currentNickname);
                localStorage.setItem('verified', currentVerified);
            }
        } catch (e) { console.error('loadProfile error', e); }
    }

    function checkAuth() {
        const userId = localStorage.getItem('userId');
        const username = localStorage.getItem('username');
        const nickname = localStorage.getItem('nickname');
        const verified = localStorage.getItem('verified') === 'true';
        if (userId && username) {
            currentUserId = userId;
            currentUsername = username;
            currentNickname = nickname || username;
            currentVerified = verified;
            showApp();
            loadProfile();
        } else {
            showAuth();
        }
    }

    function showToast(message, icon = 'info') {
        const existing = document.querySelector('.toast');
        if (existing) existing.remove();
        const div = document.createElement('div');
        div.className = 'toast';
        div.innerHTML = `<i class="fas fa-${icon}"></i> ${message}`;
        document.body.appendChild(div);
        setTimeout(() => div.remove(), 3000);
    }

    // ---- Регистрация ----
    registerBtn.addEventListener('click', async () => {
        const username = $('regUsername').value.trim();
        const nickname = $('regNickname').value.trim();
        const password = $('regPassword').value;
        if (!username || !nickname || !password) {
            registerError.textContent = 'Все поля обязательны';
            return;
        }
        try {
            const res = await fetch('/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, nickname, password })
            });
            const data = await res.json();
            if (res.ok) {
                registerSuccess.textContent = 'Регистрация успешна! Теперь войдите.';
                registerError.textContent = '';
                $('regUsername').value = '';
                $('regNickname').value = '';
                $('regPassword').value = '';
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                showToast('Аккаунт создан, войдите!', 'check-circle');
            } else {
                registerError.textContent = data.error || 'Ошибка регистрации';
                registerSuccess.textContent = '';
            }
        } catch (e) {
            registerError.textContent = 'Ошибка соединения';
        }
    });

    // ---- Логин ----
    loginBtn.addEventListener('click', async () => {
        const username = $('loginUsername').value.trim();
        const password = $('loginPassword').value;
        if (!username || !password) {
            loginError.textContent = 'Введите username и пароль';
            return;
        }
        try {
            const res = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (res.ok) {
                loginError.textContent = '';
                currentUserId = data.userId;
                currentUsername = data.username;
                currentNickname = data.nickname;
                currentVerified = data.verified || false;
                localStorage.setItem('userId', currentUserId);
                localStorage.setItem('username', currentUsername);
                localStorage.setItem('nickname', currentNickname);
                localStorage.setItem('verified', currentVerified);
                showApp();
                loadProfile();
                showToast('Добро пожаловать, ' + currentNickname + '!', 'smile');
            } else {
                loginError.textContent = data.error || 'Ошибка входа';
            }
        } catch (e) {
            loginError.textContent = 'Ошибка соединения';
        }
    });

    // ---- Переключение форм ----
    showRegister.addEventListener('click', e => {
        e.preventDefault();
        loginForm.classList.add('hidden');
        registerForm.classList.remove('hidden');
        loginError.textContent = '';
        registerError.textContent = '';
        registerSuccess.textContent = '';
    });
    showLogin.addEventListener('click', e => {
        e.preventDefault();
        loginForm.classList.remove('hidden');
        registerForm.classList.add('hidden');
        loginError.textContent = '';
        registerError.textContent = '';
        registerSuccess.textContent = '';
    });

    // ---- Выход ----
    logoutBtn.addEventListener('click', () => {
        localStorage.removeItem('userId');
        localStorage.removeItem('username');
        localStorage.removeItem('nickname');
        localStorage.removeItem('verified');
        currentUserId = null;
        currentUsername = null;
        currentNickname = null;
        chatPartnerId = null;
        if (chatInterval) clearInterval(chatInterval);
        showAuth();
        showToast('Вы вышли', 'sign-out-alt');
    });

    // ---- Смена пароля ----
    changePasswordBtn.addEventListener('click', async () => {
        const oldPwd = oldPassword.value;
        const newPwd = newPassword.value;
        if (!oldPwd || !newPwd) {
            passwordChangeResult.textContent = 'Введите оба пароля';
            passwordChangeResult.style.color = '#fca5a5';
            return;
        }
        try {
            const res = await fetch('/change-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: currentUserId, oldPassword: oldPwd, newPassword: newPwd })
            });
            const data = await res.json();
            if (res.ok) {
                passwordChangeResult.textContent = 'Пароль изменён!';
                passwordChangeResult.style.color = '#86efac';
                oldPassword.value = '';
                newPassword.value = '';
                showToast('Пароль обновлён', 'check');
            } else {
                passwordChangeResult.textContent = data.error || 'Ошибка';
                passwordChangeResult.style.color = '#fca5a5';
            }
        } catch (e) {
            passwordChangeResult.textContent = 'Ошибка соединения';
            passwordChangeResult.style.color = '#fca5a5';
        }
    });

    // ---- Обновление профиля ----
    updateProfileBtn.addEventListener('click', async () => {
        const newU = newUsername.value.trim();
        const newN = newNickname.value.trim();
        if (!newU || !newN) {
            profileUpdateResult.textContent = 'Заполните поля';
            profileUpdateResult.style.color = '#fca5a5';
            return;
        }
        try {
            const res = await fetch('/update-profile', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: currentUserId, username: newU, nickname: newN })
            });
            const data = await res.json();
            if (res.ok) {
                profileUpdateResult.textContent = 'Профиль обновлён!';
                profileUpdateResult.style.color = '#86efac';
                currentUsername = newU;
                currentNickname = newN;
                localStorage.setItem('username', newU);
                localStorage.setItem('nickname', newN);
                loadProfile();
                showToast('Профиль обновлён', 'edit');
            } else {
                profileUpdateResult.textContent = data.error || 'Ошибка';
                profileUpdateResult.style.color = '#fca5a5';
            }
        } catch (e) {
            profileUpdateResult.textContent = 'Ошибка соединения';
            profileUpdateResult.style.color = '#fca5a5';
        }
    });

    // ---- Поиск ----
    searchBtn.addEventListener('click', async () => {
        const query = searchInput.value.trim();
        if (!query) {
            searchResults.innerHTML = '<p style="color:#80809a;">Введите запрос</p>';
            return;
        }
        searchResults.innerHTML = '<div class="spinner" style="margin:20px auto;"></div>';
        try {
            const res = await fetch(`/search?q=${encodeURIComponent(query)}`);
            if (res.ok) {
                const users = await res.json();
                if (users.length === 0) {
                    searchResults.innerHTML = '<p style="color:#80809a;">Ничего не найдено</p>';
                } else {
                    let html = '';
                    users.forEach(u => {
                        if (u.id === currentUserId) return;
                        const verifiedIcon = getVerifiedSVG(u.verified || false, 16);
                        html += `<div class="search-result" data-id="${u.id}" data-username="${u.username}" data-nickname="${u.nickname}">
                            <i class="fas fa-user-circle" style="color:#6dd5fa; font-size:1.2rem;"></i>
                            <span><strong>${u.nickname}</strong> (@${u.username}) ${verifiedIcon}</span>
                        </div>`;
                    });
                    searchResults.innerHTML = html;
                    document.querySelectorAll('.search-result').forEach(el => {
                        el.addEventListener('click', function() {
                            openChat(this.dataset.id, this.dataset.nickname || this.dataset.username);
                        });
                    });
                }
            }
        } catch (e) {
            searchResults.innerHTML = '<p style="color:#fca5a5;">Ошибка загрузки</p>';
        }
    });

    // ---- Диалоги ----
    async function loadDialogs() {
        try {
            const res = await fetch(`/dialogs?userId=${currentUserId}`);
            if (res.ok) {
                dialogsList = await res.json();
                renderDialogs();
            }
        } catch(e) {
            console.error('loadDialogs error', e);
        }
    }

    function renderDialogs() {
        if (!dialogListEl) return;
        if (dialogsList.length === 0) {
            dialogListEl.innerHTML = '<div style="padding:16px;color:#80809a;text-align:center;">Нет чатов</div>';
            return;
        }
        let html = '';
        dialogsList.forEach(d => {
            const unread = unreadCounts[d.id] || 0;
            const badge = unread > 0 ? `<span class="unread-badge">${unread}</span>` : '';
            const verifiedIcon = getVerifiedSVG(d.verified || false, 16);
            html += `<div class="dialog-item" data-id="${d.id}" onclick="openChat('${d.id}','${d.nickname||d.username}')">
                <span><i class="fas fa-user-circle" style="color:#6dd5fa;margin-right:8px;"></i>${d.nickname||d.username} ${verifiedIcon}</span>
                ${badge}
            </div>`;
        });
        dialogListEl.innerHTML = html;
    }

    // ---- Открыть чат ----
    window.openChat = function(partnerId, partnerName) {
        chatPartnerId = partnerId;
        // Добавляем SVG-иконку верификации текущего пользователя (если есть)
        const myVerifiedIcon = currentVerified ? getVerifiedSVG(true, 16) : '';
        chatPartnerName.innerHTML = partnerName + ' ' + myVerifiedIcon;
        showTab('chat');
        checkBlockStatus(partnerId);
        loadMessages();
        if (chatInterval) clearInterval(chatInterval);
        chatInterval = setInterval(loadMessages, 3000);
        if (unreadCounts[partnerId]) {
            unreadCounts[partnerId] = 0;
            renderDialogs();
        }
    };

    async function checkBlockStatus(partnerId) {
        try {
            const res = await fetch(`/is-blocked?userId=${currentUserId}&otherUserId=${partnerId}`);
            if (res.ok) {
                const data = await res.json();
                isBlocked = data.blocked;
                blockChatBtn.textContent = isBlocked ? 'Разблокировать' : 'Заблокировать';
                blockChatBtn.dataset.blocked = isBlocked ? 'true' : 'false';
                messageInput.disabled = isBlocked;
                sendMessageBtn.disabled = isBlocked;
                if (isBlocked) {
                    blockChatBtn.classList.add('btn-danger');
                    blockChatBtn.classList.remove('btn-outline');
                } else {
                    blockChatBtn.classList.remove('btn-danger');
                    blockChatBtn.classList.add('btn-outline');
                }
            }
        } catch(e) {}
    }

    blockChatBtn.addEventListener('click', async () => {
        const isBlockedNow = blockChatBtn.dataset.blocked === 'true';
        const action = isBlockedNow ? 'unblock' : 'block';
        const url = `/${action}`;
        try {
            const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: currentUserId, blockUserId: chatPartnerId })
            });
            if (res.ok) {
                checkBlockStatus(chatPartnerId);
                if (action === 'unblock') {
                    loadMessages();
                    showToast('Пользователь разблокирован', 'unlock');
                } else {
                    showToast('Пользователь заблокирован', 'ban');
                }
            }
        } catch(e) {}
    });

    // ---- Загрузка сообщений ----
    async function loadMessages() {
        if (!currentUserId || !chatPartnerId) return;
        try {
            const res = await fetch(`/messages?userId=${currentUserId}&otherUserId=${chatPartnerId}`);
            if (res.ok) {
                const msgs = await res.json();
                const currentMsgs = messagesDiv.querySelectorAll('.msg');
                if (currentMsgs.length < msgs.length) {
                    const lastMsg = msgs[msgs.length - 1];
                    if (lastMsg.fromUserId !== currentUserId) {
                        if (!document.hidden) {
                            playSound('incoming');
                        } else {
                            if (Notification.permission === 'granted') {
                                new Notification('✂️ Cut-A-Rote', {
                                    body: `Новое сообщение от ${chatPartnerName.textContent}`,
                                    icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">✂️</text></svg>'
                                });
                            }
                            if (lastMsg.fromUserId !== currentUserId) {
                                unreadCounts[lastMsg.fromUserId] = (unreadCounts[lastMsg.fromUserId] || 0) + 1;
                                renderDialogs();
                            }
                        }
                        if (document.hidden) {
                            document.title = '✂️ Новое сообщение';
                            setTimeout(() => { document.title = 'Cut-A-Rote'; }, 3000);
                        }
                    }
                }
                let html = '';
                if (msgs.length === 0) {
                    html = '<p style="text-align:center;color:#80809a;padding:20px;">Нет сообщений</p>';
                } else {
                    msgs.forEach(m => {
                        const isMe = m.fromUserId === currentUserId;
                        const time = new Date(m.timestamp).toLocaleString();
                        html += `<div class="msg ${isMe ? 'me' : ''}" data-id="${m.id}" data-author="${m.fromUserId}">
                            <div>${m.text}</div>
                            <div class="time">${time}</div>
                        </div>`;
                    });
                }
                messagesDiv.innerHTML = html;
                messagesDiv.scrollTop = messagesDiv.scrollHeight;

                document.querySelectorAll('.msg.me').forEach(el => {
                    el.addEventListener('contextmenu', function(e) {
                        e.preventDefault();
                        const msgId = this.dataset.id;
                        showContextMenu(e, msgId);
                    });
                });
            }
        } catch (e) { console.error('loadMessages error', e); }
    }

    // ---- Контекстное меню ----
    let currentMessageId = null;

    function showContextMenu(e, msgId) {
        currentMessageId = msgId;
        contextMenu.style.display = 'block';
        contextMenu.style.left = e.pageX + 'px';
        contextMenu.style.top = e.pageY + 'px';
    }

    document.addEventListener('click', function(e) {
        if (!e.target.closest('.context-menu')) {
            contextMenu.style.display = 'none';
        }
    });

    contextMenu.querySelector('[data-action="delete"]').addEventListener('click', async function() {
        if (!currentMessageId) return;
        if (!confirm('Удалить это сообщение для всех?')) return;
        try {
            const res = await fetch('/delete-message', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ messageId: currentMessageId, userId: currentUserId })
            });
            if (res.ok) {
                const msgEl = document.querySelector(`.msg[data-id="${currentMessageId}"]`);
                if (msgEl) msgEl.remove();
                contextMenu.style.display = 'none';
                currentMessageId = null;
                showToast('Сообщение удалено', 'trash-alt');
            } else {
                alert('Не удалось удалить сообщение');
            }
        } catch(e) {
            alert('Ошибка удаления');
        }
    });

    // ---- Отправка сообщения ----
    sendMessageBtn.addEventListener('click', async () => {
        const text = messageInput.value.trim();
        if (!text || !chatPartnerId) return;
        playSound('outgoing');
        try {
            const res = await fetch('/send-message', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ fromUserId: currentUserId, toUserId: chatPartnerId, text })
            });
            if (res.ok) {
                messageInput.value = '';
                loadMessages();
                if (!dialogsList.find(d => d.id === chatPartnerId)) {
                    loadDialogs();
                }
            } else {
                const data = await res.json();
                alert(data.error || 'Не удалось отправить сообщение');
            }
        } catch (e) {
            alert('Ошибка соединения');
        }
    });

    // ---- Обновить чат вручную ----
    refreshChatBtn.addEventListener('click', loadMessages);

    // ---- Переключение вкладок ----
    tabButtons.forEach(btn => {
        btn.addEventListener('click', function() {
            const tabId = this.dataset.tab;
            if (tabId) showTab(tabId);
        });
    });

    // ---- Enter в полях ----
    messageInput.addEventListener('keypress', e => { if (e.key === 'Enter') sendMessageBtn.click(); });
    searchInput.addEventListener('keypress', e => { if (e.key === 'Enter') searchBtn.click(); });

    // ---- Уведомления ----
    if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
    }

    // ---- Проверка авторизации ----
    checkAuth();

    // ---- Периодическое обновление диалогов ----
    setInterval(() => {
        if (currentUserId) loadDialogs();
    }, 5000);

    // ===== АУДИО (без изменений) =====
    (function initAudio() {
        let audioCtx = null;
        let isAudioReady = false;

        const incomingSound = new Audio('https://fxzlolserverdatalog.ct.ws/audio/cut-a-rote/you%20have%20a%20message!.MP3');
        const outgoingSound = new Audio('https://fxzlolserverdatalog.ct.ws/audio/cut-a-rote/message%20sended.MP3');
        incomingSound.crossOrigin = 'anonymous';
        outgoingSound.crossOrigin = 'anonymous';
        incomingSound.preload = 'auto';
        outgoingSound.preload = 'auto';

        function fallbackBeep(type) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = type === 'incoming' ? 880 : 660;
                gain.gain.value = 0.15;
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.12);
            } catch(e) {}
        }

        window.playSound = function(type) {
            if (!isAudioReady) {
                try {
                    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    if (audioCtx.state === 'suspended') audioCtx.resume();
                    isAudioReady = true;
                    incomingSound.load();
                    outgoingSound.load();
                } catch(e) {}
            }
            const sound = type === 'incoming' ? incomingSound : outgoingSound;
            try {
                if (sound.readyState >= 2) {
                    sound.currentTime = 0;
                    sound.play().catch(() => fallbackBeep(type));
                } else {
                    sound.load();
                    sound.play().catch(() => fallbackBeep(type));
                }
            } catch(e) {
                fallbackBeep(type);
            }
        };

        document.addEventListener('click', function unlock() {
            if (!isAudioReady) {
                try {
                    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    if (audioCtx.state === 'suspended') audioCtx.resume();
                    isAudioReady = true;
                    incomingSound.load();
                    outgoingSound.load();
                } catch(e) {}
            }
            document.removeEventListener('click', unlock);
        }, { once: true });

        if (typeof playSound === 'undefined' || playSound === null) {
            playSound = window.playSound;
        }
    })();
</script>
