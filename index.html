<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Votex</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    /* ... твой существующий CSS (без изменений) ... */
    /* Я не буду повторять весь CSS, он у тебя есть. Оставь свой. */
  </style>
</head>
<body>
  <!-- ... существующий HTML (без изменений) ... -->
  <!-- Только добавлю пару элементов для уведомлений (звук) -->
  <audio id="notif-sound" src="https://fxzlolserverdatalog.ct.ws/audio/cut-a-rote/you%20have%20a%20message!.MP3"></audio>
  <audio id="send-sound" src="https://fxzlolserverdatalog.ct.ws/audio/cut-a-rote/message%20sended.MP3"></audio>

  <!-- Остальной твой HTML остаётся без изменений -->
  <!-- ... -->

  <script>
    // ---- ЗАМЕНИ ВЕСЬ СВОЙ JavaScript на этот (или добавь новые функции) ----

    // Все твои существующие переменные и функции остаются,
    // но я добавлю новый код для:
    // - звуков
    // - уведомлений
    // - диалогов
    // - удаления для всех
    // - блокировки
    // - индикатора непрочитанных

    // ---- НОВЫЕ ПЕРЕМЕННЫЕ ----
    let unreadCounts = {}; // { userId: count } для DM
    let dialogList = [];   // список всех диалогов
    let isInChat = false;  // находимся ли в чате с текущим собеседником

    // ---- ЗВУКИ ----
    function playSound(type) {
      try {
        if (type === 'incoming') {
          document.getElementById('notif-sound').play().catch(() => {});
        } else if (type === 'outgoing') {
          document.getElementById('send-sound').play().catch(() => {});
        }
      } catch (e) {}
    }

    // ---- ОБНОВЛЕНИЕ СПИСКА ДИАЛОГОВ ----
    async function loadDialogs() {
      try {
        const res = await api('/api/dialogs');
        dialogList = res;
        renderDmList(); // перерисовываем список DM
      } catch (e) {}
    }

    // ---- ПЕРЕОПРЕДЕЛЯЕМ renderDmList (с учётом диалогов и непрочитанных) ----
    // Замени свою функцию renderDmList на эту:
    function renderDmList() {
      if (activeMode !== 'dms') return;
      const c = document.getElementById('sidebar-content');
      // Формируем список: сначала группы, потом диалоги
      let html = '<div class="category">DIRECT MESSAGES</div>';
      // Диалоги (все, с кем есть переписка)
      const dialogsToShow = dialogList.filter(d => !hiddenChats.includes(d.id));
      dialogsToShow.forEach(d => {
        const unread = unreadCounts[d.id] || 0;
        const badge = unread > 0 ? `<span class="badge">${unread}</span>` : '';
        const verifiedIcon = d.verified ? ' ✅' : '';
        html += `<div class="dm-user" onclick="openDm('${d.id}','${d.username}')" oncontextmenu="showFriendContextMenu(event,'${d.id}','${d.username}')">
          <div class="avatar" style="background:${d.avatar_color||'#5865f2'}">${d.avatar_url?`<img src="${d.avatar_url}">`:d.username[0].toUpperCase()}</div>
          ${d.username}${verifiedIcon} ${badge}
        </div>`;
      });
      // Группы (как и раньше)
      if (groups.length) {
        html += '<div class="category">GROUPS</div>';
        groups.forEach(g => {
          html += `<div class="group-item" onclick="openGroup(${g.id})" oncontextmenu="showGroupContextMenu(event,${g.id},'${g.name}')">
            <div class="avatar" style="background:${g.avatar_color||'#5865f2'}">${(g.name||'G')[0].toUpperCase()}</div>${g.name}
          </div>`;
        });
      }
      // Друзья (которые не в диалогах?) – можно добавить отдельно, но пока оставим как есть
      // также запросы в друзья
      // ... добавь свою логику для pending requests
      c.innerHTML = html;
    }

    // ---- ПЕРЕОПРЕДЕЛЯЕМ openDm (сброс непрочитанных) ----
    // Замени свою функцию openDm на эту:
    async function openDm(friendId, username) {
      activeMode = 'dms';
      activeDmFriend = friendId;
      activeGroupId = null;
      activeServerId = null;
      activeChannelId = null;
      // Сбрасываем непрочитанные
      if (unreadCounts[friendId]) {
        unreadCounts[friendId] = 0;
        renderDmList();
      }
      document.getElementById('sidebar-title').textContent = 'Direct Messages';
      document.getElementById('members').style.display = 'none';
      document.getElementById('chat-header-text').innerHTML = `@ ${username}`;
      document.getElementById('messages').innerHTML = '';
      if (currentDmRoom) {
        socket.emit('dm-leave', currentDmRoom);
        currentDmRoom = null;
      }
      const room = [currentUser.id, friendId].sort().join('-');
      currentDmRoom = room;
      socket.emit('dm-join', friendId);
      try {
        const msgs = await api(`/api/dm/${friendId}`);
        document.getElementById('messages').innerHTML = '';
        msgs.forEach(addDmMessage);
      } catch (e) {}
      // Отметить, что мы в чате
      isInChat = true;
    }

    // ---- ОБРАБОТЧИКИ СОКЕТ-СОБЫТИЙ (дополненные) ----
    // Вместо существующих обработчиков, нужно добавить логику уведомлений и диалогов.
    // Переопределяем обработку dm-message, new-message, group-message.

    // В функции connectSocket (или после инициализации) добавляем:
    socket.on('dm-message', (msg) => {
      // Если сообщение от нас самих – не уведомляем
      if (msg.sender_id === currentUser.id) {
        // Добавляем в чат, если он открыт
        if (activeDmFriend && activeDmFriend === msg.sender_id) {
          addDmMessage(msg);
        }
        return;
      }
      // Проверяем, что мы не заблокировали отправителя
      // (блокировка уже проверяется на сервере, но на всякий случай)
      // Добавляем в диалоги, если его там нет
      if (!dialogList.find(d => d.id === msg.sender_id)) {
        // добавляем в список диалогов
        loadDialogs();
      }
      // Звук уведомления
      const isActive = !document.hidden;
      const isCurrentChat = (activeMode === 'dms' && activeDmFriend === msg.sender_id);
      if (!isCurrentChat) {
        playSound('incoming');
        // Увеличиваем счетчик непрочитанных
        if (!unreadCounts[msg.sender_id]) unreadCounts[msg.sender_id] = 0;
        unreadCounts[msg.sender_id]++;
        renderDmList();
        // Показываем уведомление (если разрешено)
        if (Notification.permission === 'granted') {
          new Notification('New message from ' + msg.username, { body: msg.content });
        } else if (Notification.permission === 'default') {
          Notification.requestPermission();
        }
      } else {
        // Если мы в этом чате, просто добавляем сообщение
        addDmMessage(msg);
      }
      // Если вкладка не активна, мигаем заголовком (опционально)
      if (document.hidden) {
        document.title = '📩 New message';
        setTimeout(() => { document.title = 'Votex'; }, 3000);
      }
    });

    // Аналогично для каналов и групп:
    // - new-message: если мы не в этом канале, звук + уведомление + увеличить непрочитанные? Для каналов можно отдельный счетчик, но пока пропустим.
    // - group-message: аналогично.

    // ---- УДАЛЕНИЕ СООБЩЕНИЯ ДЛЯ ВСЕХ (событие) ----
    socket.on('message-deleted', ({ messageId, type, roomId }) => {
      // Удаляем DOM-элемент сообщения
      const msgElement = document.querySelector(`.message[data-msg-id="${messageId}"]`);
      if (msgElement) {
        msgElement.remove();
      }
    });

    // ---- КОНТЕКСТНОЕ МЕНЮ ДЛЯ СВОИХ СООБЩЕНИЙ ----
    // В функции showMessageContextMenu добавляем пункт "Delete for everyone"
    // Находим эту функцию и добавляем:
    function showMessageContextMenu(e, msg, type) {
      e.preventDefault();
      const menu = document.getElementById('context-menu');
      const isMe = (type === 'dm' && msg.sender_id === currentUser.id) ||
                   (type === 'channel' && msg.user_id === currentUser.id) ||
                   (type === 'group' && msg.sender_id === currentUser.id);
      let items = '';
      items += `<div class="item" onclick="replyToMessage('${msg.id}','${type}')">Reply</div>`;
      items += `<div class="item" onclick="forwardMessage('${msg.id}','${type}')">Forward</div>`;
      if (isMe) {
        items += `<div class="item" onclick="editMessage('${msg.id}','${type}')">Edit</div>`;
        items += `<div class="item danger" onclick="deleteForEveryone('${msg.id}','${type}')">Delete for everyone</div>`;
      }
      // ... остальные пункты (Pin и т.д.)
      menu.innerHTML = items;
      menu.style.display = 'block';
      menu.style.left = e.pageX + 'px';
      menu.style.top = e.pageY + 'px';
      document.addEventListener('click', () => menu.style.display = 'none', { once: true });
    }

    // ---- ФУНКЦИЯ УДАЛЕНИЯ ДЛЯ ВСЕХ ----
    function deleteForEveryone(messageId, type) {
      let roomId = null;
      if (type === 'dm') {
        roomId = activeDmFriend;
      } else if (type === 'channel') {
        roomId = activeChannelId;
      } else if (type === 'group') {
        roomId = activeGroupId;
      }
      if (!roomId) return;
      if (confirm('Delete this message for everyone?')) {
        socket.emit('delete-message', { messageId, type, roomId });
        // Локально удаляем сразу (оптимистично)
        const el = document.querySelector(`.message[data-msg-id="${messageId}"]`);
        if (el) el.remove();
      }
    }

    // ---- БЛОКИРОВКА ПОЛЬЗОВАТЕЛЯ ----
    // В контекстном меню друга добавляем пункт "Block"
    // В showFriendContextMenu:
    function showFriendContextMenu(e, friendId, username) {
      e.preventDefault();
      const menu = document.getElementById('context-menu');
      menu.innerHTML = `
        <div class="item" onclick="viewProfile('${friendId}')">View Profile</div>
        <div class="item" onclick="removeFriend('${friendId}')">Remove Friend</div>
        <div class="item danger" onclick="blockUser('${friendId}')">Block</div>
        <div class="item" onclick="closeChat('${friendId}')">Close Chat</div>
      `;
      menu.style.display = 'block';
      menu.style.left = e.pageX + 'px';
      menu.style.top = e.pageY + 'px';
      document.addEventListener('click', () => menu.style.display = 'none', { once: true });
    }

    // Функция blockUser (переопределяем):
    async function blockUser(userId) {
      if (confirm('Block this user? You will no longer receive messages from them.')) {
        try {
          await api('/api/block', 'POST', { userId });
          alert('User blocked');
          // Обновляем список диалогов и друзей
          loadDialogs();
          loadFriends();
          // Если мы в чате с этим пользователем, закрываем его
          if (activeDmFriend === userId) {
            showDMs();
          }
        } catch (e) {
          alert('Block failed');
        }
      }
    }

    // ---- ОТПРАВКА СООБЩЕНИЯ С ЗВУКОМ ----
    // Переопределяем sendMessage, добавив playSound('outgoing')
    // В существующей функции sendMessage после отправки добавляем:
    // playSound('outgoing');

    // ---- ЗАГРУЗКА ДИАЛОГОВ ПРИ СТАРТЕ ----
    // В initApp после loadFriends вызываем loadDialogs();

    // ---- ОБНОВЛЕНИЕ СОСТОЯНИЯ ВКЛАДКИ ----
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        document.title = 'Votex';
      }
    });

    // ---- ЗАПРОС РАЗРЕШЕНИЯ НА УВЕДОМЛЕНИЯ ----
    if ('Notification' in window && Notification.permission === 'default') {
      Notification.requestPermission();
    }

    // ---- ИНИЦИАЛИЗАЦИЯ (добавить loadDialogs в initApp) ----
    // Переопредели initApp:
    async function initApp() {
      loadUserInfo();
      await loadFriends();
      await loadDialogs(); // <-- добавить
      await loadServers();
      await loadGroups();
      showDMs();
      applyTheme();
      applyTranslations();
    }

    // ---- ВСЁ ОСТАЛЬНОЕ ОСТАВЛЯЕМ БЕЗ ИЗМЕНЕНИЙ ----

    // ... твой существующий код (функции для серверов, каналов, групп, друзей и т.д.) ...
    // Важно: не удаляй существующий код, только добавь/переопредели указанные функции.
    // Я дал только новые/изменённые части. Всё остальное остаётся как у тебя.

  </script>
</body>
</html>
